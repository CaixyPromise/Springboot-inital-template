spring:
  config:
    import:
      - classpath:base.yml
  data:
    redis:
      host: ${caixy.adminSystem.config.redis.host}
      port: ${caixy.adminSystem.config.redis.port}
  redis:
    redisson:
      config: |
        threads: 16
        nettyThreads: 32
        transportMode: "NIO"
        singleServerConfig:
          idleConnectionTimeout: 10000
          connectTimeout: 10000
          timeout: 3000
          retryAttempts: 3
          retryInterval: 1500
          subscriptionsPerConnection: 5
          clientName: null
          address: "redis://${caixy.adminSystem.config.redis.host}:${caixy.adminSystem.config.redis.port}"
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
          connectionMinimumIdleSize: 24
          connectionPoolSize: 64
          database: 0
          dnsMonitoringInterval: 5000
          #password: ${caixy.adminSystem.config.redis.password}
        


